<header class="navbar bg-base-100 border-base-300 sticky top-0 z-30 border-b">
  <div class="navbar-start">
    @if (isMobile()) {
      <details #navMenu class="dropdown">
        <summary class="btn btn-ghost btn-square" aria-label="Mở menu điều hướng">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </summary>
        <ul
          class="dropdown-content menu menu-sm rounded-box bg-base-100 mt-3 w-52 p-2 shadow-sm"
          tabindex="0"
          (click)="navMenu.open = false"
          (keydown.enter)="navMenu.open = false"
          (keydown.space)="navMenu.open = false"
        >
          @for (item of navItems; track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="menu-active"
                [routerLinkActiveOptions]="{ exact: item.exact }"
                ariaCurrentWhenActive="page"
              >
                {{ item.labelKey | translate }}
              </a>
            </li>
          }
        </ul>
      </details>
    }

    <a class="btn btn-ghost text-xl" routerLink="/">Shop</a>
  </div>

  @if (!isMobile()) {
    <nav class="navbar-center" aria-label="Điều hướng chính">
      <ul class="menu menu-horizontal px-1">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="menu-active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              ariaCurrentWhenActive="page"
            >
              {{ item.labelKey | translate }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }

  <div class="navbar-end gap-2">
    <app-language-switch />

    <a class="btn btn-ghost btn-sm" routerLink="/login">Đăng nhập</a>
    <a class="btn btn-primary btn-sm" routerLink="/register">Đăng ký</a>
  </div>
</header>
